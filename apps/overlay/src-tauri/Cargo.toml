[package]
name = "aoe2-overlay"
version = "0.2.0"
description = "Overlay de estrategias de apertura para Age of Empires II: DE"
authors = ["AoE2 Overlay contributors"]
license = "MIT"
repository = "https://github.com/sk8erlucas/aoe2-overlay"
edition = "2021"
rust-version = "1.80"

[lib]
name = "aoe2_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-window-state = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
