name: 🐞 Reportar un bug
description: Algo no funciona como debería
labels: ["bug"]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: ¿Qué pasó?
      description: Describí el problema y qué esperabas que pasara.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abrir el overlay
        2. ...
    validations:
      required: true
  - type: dropdown
    id: parte
    attributes:
      label: ¿Qué parte?
      options:
        - Overlay (escritorio)
        - Web
        - API
        - Otra
    validations:
      required: true
  - type: dropdown
    id: pantalla
    attributes:
      label: Modo de pantalla del juego (si es el overlay)
      options:
        - Ventana sin bordes (borderless)
        - Pantalla completa
        - Ventana
        - No aplica
  - type: input
    id: version
    attributes:
      label: Versión del overlay y de Windows
      placeholder: "v0.1.0 / Windows 11 24H2"
  - type: textarea
    id: extra
    attributes:
      label: Capturas o logs
