name: Release del overlay

# Se dispara al subir un tag de versión:
#   git tag v0.1.0 && git push origin v0.1.0
# Compila el instalador de Windows y lo publica en GitHub Releases
# (el botón "Descargar" de la web apunta al último release).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/overlay/src-tauri

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Firma de las actualizaciones (ver docs/deploy-dokploy.md, "Actualizaciones").
          # Sin estos secrets el build falla: tauri.conf.json pide createUpdaterArtifacts.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Sube latest.json al release: el overlay instalado lo lee para actualizarse.
          includeUpdaterJson: true
          projectPath: apps/overlay
          tagName: ${{ github.ref_name }}
          releaseName: "AoE2 Overlay ${{ github.ref_name }}"
          releaseBody: |
            Instalador para Windows 10/11.

            - **`AoE2.Overlay_*_x64-setup.exe`**: instalador recomendado.
            - `.msi`: alternativa para instalaciones administradas.
            - `SHA256SUMS.txt`: hashes para comprobar la descarga (`Get-FileHash <archivo>` en PowerShell).

            Windows puede mostrar el aviso de SmartScreen porque el instalador todavía no está firmado: "Más información" → "Ejecutar de todas formas".
          releaseDraft: false
          prerelease: false

      # Hashes de los instaladores publicados, para verificar las descargas mientras no estén firmados.
      - name: Publicar SHA256SUMS.txt
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          New-Item -ItemType Directory -Force hashes | Out-Null
          gh release download $env:TAG --pattern "*.exe" --pattern "*.msi" --dir hashes
          $lines = Get-ChildItem hashes | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          [IO.File]::WriteAllText("$PWD/SHA256SUMS.txt", ($lines -join "`n") + "`n")
          Get-Content SHA256SUMS.txt
          gh release upload $env:TAG SHA256SUMS.txt --clobber
