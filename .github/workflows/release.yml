name: Release del overlay

# Se dispara al subir un tag de versión:
#   git tag v0.1.0 && git push origin v0.1.0
# Compila el instalador de Windows y lo publica en GitHub Releases
# (el botón "Descargar" de la web apunta al último release).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/overlay/src-tauri

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/overlay
          tagName: ${{ github.ref_name }}
          releaseName: "AoE2 Overlay ${{ github.ref_name }}"
          releaseBody: |
            Instalador para Windows 10/11.

            - **`AoE2.Overlay_*_x64-setup.exe`**: instalador recomendado.
            - `.msi`: alternativa para instalaciones administradas.

            Windows puede mostrar el aviso de SmartScreen porque el instalador todavía no está firmado: "Más información" → "Ejecutar de todas formas".
          releaseDraft: false
          prerelease: false
